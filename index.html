<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* print */
#pr{display:none}
.msr{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--g2);border-radius:8px;margin-bottom:6px;flex-wrap:wrap;cursor:pointer;background:var(--cd);border-inline-start:5px solid var(--g3)}
.msr.on{outline:2px solid var(--red)}.msr.done{border-inline-start-color:var(--g4)}.msr.late{border-inline-start-color:var(--red);background:var(--rs)}.msr.risk{border-inline-start-color:var(--red)}

.mtg{font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap}.t-late{background:var(--red);color:#fff}.t-risk{border:1px dashed var(--red);color:var(--red)}.t-ok{background:var(--g1);border:1px solid var(--g2);color:var(--g3)}.t-done{background:var(--g4);color:#fff}.t-gate{border:1px solid var(--g3);color:var(--tx)}
.bar.dk i{background:var(--g4)}
.cell{border-radius:6px;padding:4px 2px;font-size:12px;font-weight:600}.c-done{background:var(--g4);color:#fff}.c-go{background:var(--g1);border:1px solid var(--g2)}.c-late{background:var(--red);color:#fff}.c-risk{border:1px dashed var(--red);color:var(--red)}.c-new{color:var(--g3)}
.mx td[data-a]{cursor:pointer}
.pri{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--g2)}.pri.h{background:var(--red);color:#fff;border-color:var(--red)}.pri.m{border-color:var(--red);color:var(--red)}
.ban{border:1px solid var(--red);background:var(--rs);border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--g2);border-radius:8px;margin-bottom:5px;font-size:13px;flex-wrap:wrap}.file a,.file b{flex:1}
.gh2{background:var(--red)}.sep2h{background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;margin:22px 0 4px;font-weight:700}
.fr{border:1.5px solid var(--sc,var(--g4));border-radius:6px;margin:10px 0;overflow:hidden}.fr h4{margin:0;background:var(--sc,var(--g4));color:#fff;padding:4px 10px;font-size:13px}.fr table{margin:0;min-width:0}
#pr .fr h4{font-size:12px}#pr .fr table{margin:0}
.cm div{white-space:pre-wrap}.mgap{height:22px}
.qty{display:inline-block;min-width:34px;text-align:center;font-weight:700;border:2px solid var(--g3);border-radius:6px;padding:0 6px;background:var(--cd);color:var(--tx)}
.it .qtyb{width:68px;flex:none;text-align:center;font-weight:700;border:2px solid var(--g3);border-radius:6px;padding:2px 4px}
#pr .qty{border:1.5px solid var(--ac);font-size:11px;padding:0 5px;min-width:26px;background:#fff;color:#000}
.fr td.nw,.fr th{white-space:nowrap}
.fr td{padding:3px 6px;font-size:12.5px;line-height:1.35}.fr th{padding:3px 6px;font-size:11px}.fr td small{font-size:10px}
#pr .fr td{padding:2px 5px;font-size:10.5px;line-height:1.3}#pr .fr th{padding:2px 5px;font-size:9.5px}#pr .fr td small{font-size:8.5px}#pr .fr .cp{padding:0 6px;font-size:9.5px}
.cnt{font-size:11px;background:var(--g4);color:#fff;border-radius:10px;padding:1px 8px;margin:0 8px;white-space:nowrap;display:inline-block;unicode-bidi:isolate}
.lt2 tr.trw:hover{background:var(--g1)}.lt2 .ar{cursor:pointer;color:var(--g3);display:inline-block;width:16px}.lt2 td input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);cursor:pointer}
.parb{border:1px solid var(--red);background:var(--rs);border-radius:8px;padding:8px 10px;margin-bottom:10px}.parb b{font-size:12px;color:var(--red);display:block}.parb select{width:auto;margin-inline-start:8px}
.tg2{display:flex;gap:6px;align-items:flex-start;margin-top:10px;font-size:13px}.tg2 input{width:auto;margin-top:3px}
.so{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:6px;flex-wrap:wrap}.so:hover{background:var(--g1)}.so input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);cursor:pointer}
.sot{flex:1;min-width:120px;width:auto;border:0;border-bottom:1px solid transparent;border-radius:0;background:transparent;padding:4px;font-size:14px;color:inherit}.sot:focus{border-bottom-color:var(--red);outline:0}
.so.dn .sot{text-decoration:line-through;color:var(--g3)}.so .pg3{font-size:11px;color:var(--g3);min-width:34px;text-align:center}.so.draft .sot{border-bottom:1px dashed var(--g2)}
.s-rev{background:var(--cd);color:var(--red);border:1px dashed var(--red)}
.tr{background:var(--cd);border:1px solid var(--g2);border-radius:8px;margin-bottom:5px;border-inline-start:5px solid var(--g3)}
.tr.go{border-inline-start-color:var(--red)}.tr.done{border-inline-start-color:var(--g4)}.tr.block,.tr.rev{border-inline-start-color:var(--red);background:var(--rs)}
.rw{display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}.rw .ar{width:16px;color:var(--g3);cursor:pointer;text-align:center}
.rw>input[type=checkbox]{width:19px;height:19px;accent-color:var(--red);cursor:pointer}.rw .bd{flex:1;min-width:150px}
.tr.done .tt{text-decoration:line-through;color:var(--g3)}.lv2{margin-inline-start:22px}.lv3{margin-inline-start:44px}
.tg{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--g1);border:1px solid var(--g2);color:var(--g3);white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--cd);border:1px solid var(--g2);border-radius:10px;padding:12px 14px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.crumb{font-size:13px;color:var(--g3);margin-bottom:6px}.crumb a{color:var(--red);cursor:pointer}
.tin{width:100%;font-size:19px;font-weight:700;border:0;border-bottom:2px solid var(--g2);border-radius:0;padding:4px 0;margin-bottom:8px;background:transparent}
.f label{display:block;font-size:12px;color:var(--g3);margin:8px 0 2px}.f select,.f input[type=date],.f textarea{width:100%}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cl{margin-bottom:10px}.cl .h{font-size:12px;color:var(--g3);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.star{cursor:pointer;color:var(--g2);font-size:16px}.star.on{color:var(--red)}
.addr{display:flex;gap:6px;margin-top:6px}.addr input{flex:1}
.cm{border-inline-start:3px solid var(--g2);padding:4px 10px;margin-bottom:8px;font-size:13px}.cm b{font-size:12px}
.hs{font-size:12px;color:var(--g3);border-bottom:1px dashed var(--g2);padding:4px 0}
.sub{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--g2);border-radius:6px;margin-bottom:4px;flex-wrap:wrap;cursor:pointer}.sub:hover{border-color:var(--red)}
tr[draggable]{cursor:grab}
#pr,#pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr{--ac:#d62828;--hd:#d62828;--hdt:#fff;--sc:#2b2d31;--zb:#f3f3f4;--ln:#c9ccd1;--mt:#6b7078;color:#1d1f23;font-size:12px}
#pr.bw{--ac:#000;--hd:#fff;--hdt:#000;--sc:#000;--zb:#f2f2f2;--ln:#999;--mt:#444}
#pr .pg{display:flex;flex-direction:column;min-height:286mm;page-break-after:always}#pr .pg:last-child{page-break-after:auto}
#pr .hb{background:var(--hd);color:var(--hdt);padding:14px 12mm;display:flex;justify-content:space-between;align-items:center}#pr.bw .hb{border-bottom:4px solid #000}
#pr .lg{font-size:20px;font-weight:700}#pr .dt{font-size:12px}
#pr .pbd{padding:8mm 12mm;flex:1}#pr .ti{font-size:22px;margin:0 0 3px}#pr .su{color:var(--mt);margin-bottom:10px}
#pr .bx{display:flex;gap:8px;margin-bottom:12px}#pr .bx div{flex:1;border:1px solid var(--ln);border-radius:6px;padding:5px 9px;background:var(--zb)}#pr .bx small{display:block;color:var(--mt);font-size:10px}#pr .bx b{font-size:15px}
#pr .sb{background:var(--sc);color:#fff;padding:5px 9px;display:flex;justify-content:space-between;margin-top:10px;border-radius:4px 4px 0 0;font-size:12px}
#pr table{width:100%;border-collapse:collapse;margin:0 0 6px}#pr th{background:var(--zb);border:1px solid var(--ln);padding:4px 6px;font-size:10px;color:var(--mt)}#pr td{border:1px solid var(--ln);padding:4px 6px;font-size:11px}
#pr tr{page-break-inside:avoid}#pr tr.p td{background:var(--zb);font-weight:700}#pr tr.s td:nth-child(2){padding-inline-start:18px}
.cp{font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid var(--g2)}
#pr .cp{border-color:var(--ln)}.c-done{background:var(--g4);color:#fff;border-color:var(--g4)}.c-go{border-color:var(--red);color:var(--red)}.c-blk{background:var(--red);color:#fff;border-color:var(--red)}
#pr .c-done{background:var(--sc);border-color:var(--sc)}#pr .c-go{border-color:var(--ac);color:var(--ac)}#pr .c-blk{background:var(--ac);border-color:var(--ac)}

#pr .sec{border-inline-start:5px solid var(--ac);padding-inline-start:8px;font-size:14px;font-weight:700;margin:14px 0 7px}

@page{size:A4;margin:0}
@media(max-width:700px){.app{flex-direction:column}.side{width:100%;padding:6px 0}.logo{display:none}.nav{display:flex;overflow-x:auto}.nav a{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent}.nav a.on{border-bottom-color:var(--red)}.pad{padding:14px}}
@media print{.side,.top,.tools,.ov,#toast{display:none!important}body{background:#fff}body.pm .app{display:none!important}body.pm #pr{display:block}}
</style>
</head>
<body>
